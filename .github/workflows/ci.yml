name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Tests run against real Postgres, never SQLite. The old backend used
      # SQLite in dev and Postgres in production, which let dialect-specific
      # bugs through.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: printvendo
          POSTGRES_PASSWORD: printvendo
          POSTGRES_DB: printvendo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U printvendo"
          --health-interval 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://printvendo:printvendo@localhost:5433/printvendo_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Module boundaries
        run: lint-imports

      - name: Tests
        run: pytest -q
