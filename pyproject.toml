[project]
name = "printvendo-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "redis>=5.2",
    "cryptography>=43.0",
    "slowapi>=0.1.9",
    "google-auth>=2.35",
    # PDF structure parsing at upload time. libqpdf, so it reads the structure
    # without rendering -- milliseconds, and nothing to execute.
    "pikepdf>=9.4",
    # Photo printing: images composed onto an A4 canvas server-side.
    "pillow>=11.0",
    # Multipart form parsing. FastAPI raises at import time without it, so a
    # missing dependency here breaks route collection rather than one endpoint.
    "python-multipart>=0.0.20",
    # The Razorpay client is ours, not their SDK: the module talks to a
    # protocol so the whole payment flow is testable without a network, and
    # their SDK would drag in its own transport and error types for the sake of
    # three HTTP calls.
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "import-linter>=2.1",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Revision bodies are machine-written by `alembic revision --autogenerate`:
#   F401 - the template always imports `sa` and `Sequence`, unused in a
#          revision that adds no columns.
#   E501 - autogenerate emits one long call per column and does not wrap.
# The template itself is modernised (migrations/script.py.mako) so the UP and
# import-ordering rules still apply. Reformatting generated code by hand every
# revision is not a sustainable alternative.
"migrations/versions/*.py" = ["F401", "E501"]
